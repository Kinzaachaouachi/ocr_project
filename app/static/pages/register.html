<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OCR Intelligence — Inscription</title>
        <meta
            name="description"
            content="Créez votre compte OCR Intelligence pour extraire du texte avec 4 modèles IA en parallèle."
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/theme.css" />
        <style>
            .file-upload-wrapper {
                position: relative;
            }
            
            .btn-danger {
                background: #ef4444 !important;
                color: white !important;
            }
            
            .btn-danger:hover {
                background: #dc2626 !important;
            }
        </style>
    </head>
    <body>
        <div class="auth-page">
            <a class="brand auth-top-brand" href="/">
                <div class="logo">AI</div>
                <div class="brand-text">OCR Intelligence</div>
            </a>

            <div class="auth-card">
                <div class="auth-card-header">
                    <h2 class="auth-title">Créer un compte</h2>
                    <p class="auth-subtitle">
                        Quelques informations pour démarrer.
                    </p>
                </div>

                <div id="alert" class="alert"></div>

                <form id="registerForm" novalidate>
                    <div class="field">
                        <label for="email">Adresse email *</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                            placeholder="vous@exemple.com"
                        />
                        <div class="error-text" id="email-error"></div>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="firstName">Prénom *</label>
                            <input
                                type="text"
                                id="firstName"
                                name="first_name"
                                required
                                autocomplete="given-name"
                                placeholder="Jean"
                            />
                            <div class="error-text" id="firstName-error"></div>
                        </div>

                        <div class="field">
                            <label for="lastName">Nom *</label>
                            <input
                                type="text"
                                id="lastName"
                                name="last_name"
                                required
                                autocomplete="family-name"
                                placeholder="Dupont"
                            />
                            <div class="error-text" id="lastName-error"></div>
                        </div>
                    </div>

                    <div class="field">
                        <label for="profileImage">Photo de profil (Optionnel)</label>
                        <div class="file-upload-wrapper">
                            <input
                                type="file"
                                id="profileImage"
                                name="profile_image"
                                accept="image/*"
                                style="display: none;"
                            />
                            <button type="button" class="btn btn-secondary btn-block" onclick="document.getElementById('profileImage').click()">
                                📷 Choisir une photo
                            </button>
                            <div id="imagePreview" style="display: none; margin-top: 12px; text-align: center;">
                                <img id="previewImg" src="" alt="Aperçu" style="max-width: 150px; max-height: 150px; border-radius: 8px; border: 2px solid var(--primary-500);">
                                <button type="button" class="btn btn-sm btn-danger" onclick="clearImagePreview()" style="margin-top: 8px;">✕ Supprimer</button>
                            </div>
                            <div class="error-text" id="profileImage-error"></div>
                        </div>
                    </div>

                    <div class="field password-field">
                        <label for="password">Mot de passe *</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autocomplete="new-password"
                            placeholder="••••••••"
                        />
                        <span
                            class="password-toggle"
                            onclick="togglePassword('password')"
                            >👁️</span
                        >
                        <div class="error-text" id="password-error"></div>
                        <div class="field-hint">
                            <strong>Exigences du mot de passe :</strong>
                            <ul>
                                <li id="length-check">Au moins 8 caractères</li>
                                <li id="lowercase-check">Au moins une lettre minuscule</li>
                                <li id="uppercase-check">Au moins une lettre majuscule</li>
                                <li id="number-check">Au moins un chiffre</li>
                                <li id="special-check">Au moins un caractère spécial</li>
                            </ul>
                        </div>
                    </div>

                    <div class="field password-field">
                        <label for="confirmPassword"
                            >Confirmer le mot de passe *</label
                        >
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            required
                            autocomplete="new-password"
                            placeholder="••••••••"
                        />
                        <span
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword')"
                            >👁️</span
                        >
                        <div
                            class="error-text"
                            id="confirmPassword-error"
                        ></div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-block"
                        id="registerBtn"
                    >
                        <span class="spinner-sm" id="registerSpinner"></span>
                        <span id="registerBtnText">Créer le compte</span>
                    </button>
                </form>

                <div class="auth-divider"><span>ou</span></div>

                <p class="auth-footer-link">
                    Déjà un compte ?
                    <a href="/">Se connecter</a>
                </p>
            </div>
        </div>

        <script>
            const API_BASE = "/api";

            
            const EMAIL_REGEX = /^[a-zA-Z0-9]([a-zA-Z0-9._-]*[a-zA-Z0-9])?@[a-zA-Z0-9]([a-zA-Z0-9.-]*[a-zA-Z0-9])?\.([a-zA-Z]{2,})$/;
            const NAME_REGEX = /^[a-zA-ZàâäéèêëîïôöùûüÿñçÀÂÄÉÈÊËÎÏÔÖÙÛÜŸÑÇ\s\-']+$/;
            
            // Mots de passe faibles à éviter
            const WEAK_PASSWORDS = [
                "password", "123456", "123456789", "qwerty", "abc123", 
                "password123", "admin", "letmein", "welcome", "monkey",
                "1234567890", "password1", "123123", "admin123"
            ];

            function togglePassword(inputId) {
                const input = document.getElementById(inputId);
                const toggle = input.nextElementSibling;

                if (input.type === "password") {
                    input.type = "text";
                    toggle.textContent = "🙈";
                } else {
                    input.type = "password";
                    toggle.textContent = "👁️";
                }
            }

            function validateEmail(email) {
                if (!email.trim()) {
                    return "L'email est obligatoire";
                }
                
                email = email.trim().toLowerCase();
                
                if (email.length > 254) {
                    return "L'email est trop long (maximum 254 caractères)";
                }
                
                if (!EMAIL_REGEX.test(email)) {
                    return "Format d'email invalide";
                }
                
                // Vérification des caractères interdits
                const forbiddenChars = [' ', '\t', '\n', '\r', '+', '='];
                if (forbiddenChars.some(char => email.includes(char))) {
                    return "L'email contient des caractères non autorisés";
                }
                
                // Vérification de la partie locale et du domaine
                const parts = email.split('@');
                const localPart = parts[0];
                const domain = parts[1];
                
                if (localPart.length < 1 || localPart.length > 64) {
                    return "La partie locale de l'email doit contenir entre 1 et 64 caractères";
                }
                
                if (domain.length < 4 || domain.length > 253) {
                    return "Le domaine de l'email est invalide";
                }
                
                return null;
            }

            function validatePassword(password) {
                const errors = [];
                
                if (!password) {
                    return "Le mot de passe est obligatoire";
                }
                
                if (password.length < 8) {
                    errors.push("au moins 8 caractères");
                }
                
                if (password.length > 128) {
                    return "Le mot de passe est trop long (maximum 128 caractères)";
                }
                
                if (!/[a-z]/.test(password)) {
                    errors.push("au moins une lettre minuscule");
                }
                
                if (!/[A-Z]/.test(password)) {
                    errors.push("au moins une lettre majuscule");
                }
                
                if (!/\d/.test(password)) {
                    errors.push("au moins un chiffre");
                }
                
                if (!/[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password)) {
                    errors.push("au moins un caractère spécial");
                }
                
                if (errors.length > 0) {
                    return `Le mot de passe doit contenir ${errors.join(', ')}`;
                }
                
                // Vérification des mots de passe faibles
                if (WEAK_PASSWORDS.includes(password.toLowerCase())) {
                    return "Ce mot de passe est trop commun. Choisissez un mot de passe plus sécurisé";
                }
                
                // Vérification des séquences
                const sequences = ["123456", "abcdef", "qwerty", "azerty", "654321"];
                if (sequences.some(seq => password.toLowerCase().includes(seq))) {
                    return "Le mot de passe ne doit pas contenir de séquences évidentes";
                }
                
                return null;
            }

            function updatePasswordStrength(password) {
                const checks = [
                    { id: 'length-check', test: password.length >= 8 },
                    { id: 'lowercase-check', test: /[a-z]/.test(password) },
                    { id: 'uppercase-check', test: /[A-Z]/.test(password) },
                    { id: 'number-check', test: /\d/.test(password) },
                    { id: 'special-check', test: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/.test(password) }
                ];
                
                checks.forEach(check => {
                    const element = document.getElementById(check.id);
                    if (element) {
                        if (check.test) {
                            element.style.color = '#10b981';
                            element.innerHTML = '✓ ' + element.textContent.replace(/^[✓✗] /, '');
                        } else {
                            element.style.color = '#ef4444';
                            element.innerHTML = '✗ ' + element.textContent.replace(/^[✓✗] /, '');
                        }
                    }
                });
            }

            function validateName(name, fieldName) {
                if (!name || !name.trim()) {
                    return `Le ${fieldName} est obligatoire`;
                }
                
                name = name.trim();
                
                if (name.length < 2) {
                    return `Le ${fieldName} doit contenir au moins 2 caractères`;
                }
                
                if (name.length > 50) {
                    return `Le ${fieldName} est trop long (maximum 50 caractères)`;
                }
                
                if (!NAME_REGEX.test(name)) {
                    return `Le ${fieldName} ne peut contenir que des lettres, espaces, tirets et apostrophes`;
                }
                
                if (!/[a-zA-ZàâäéèêëîïôöùûüÿñçÀÂÄÉÈÊËÎÏÔÖÙÛÜŸÑÇ]/.test(name)) {
                    return `Le ${fieldName} doit contenir au moins une lettre`;
                }
                
                return null;
            }

            function showFieldError(fieldId, message) {
                const field = document.getElementById(fieldId);
                const errorDiv = document.getElementById(fieldId + "-error");

                if (message) {
                    field.classList.add("error");
                    errorDiv.textContent = message;
                    errorDiv.style.display = "block";
                } else {
                    field.classList.remove("error");
                    errorDiv.style.display = "none";
                }
            }

            function showAlert(message, type = "error") {
                const alertDiv = document.getElementById("alert");
                alertDiv.textContent = message;
                alertDiv.className = `alert ${type}`;
                alertDiv.style.display = "block";

                if (type === "success") {
                    setTimeout(() => {
                        alertDiv.style.display = "none";
                    }, 5000);
                }
            }

            function validateImage(file) {
                if (!file) return null; 
                
                const maxSizeMB = 5;
                const maxSizeBytes = maxSizeMB * 1024 * 1024;
                const allowedTypes = ['image/jpeg', 'image/png', 'image/gif', 'image/webp'];
                
                if (!allowedTypes.includes(file.type)) {
                    return `Format d'image non supporté. Formats acceptés: JPEG, PNG, GIF, WebP`;
                }
                
                if (file.size > maxSizeBytes) {
                    return `L'image est trop volumineuse. Taille maximale: ${maxSizeMB}MB`;
                }
                
                return null;
            }

            function clearImagePreview() {
                document.getElementById('profileImage').value = '';
                document.getElementById('imagePreview').style.display = 'none';
                document.getElementById('profileImage-error').style.display = 'none';
            }

            function hideAlert() {
                document.getElementById("alert").style.display = "none";
            }

            
            document.getElementById("password").addEventListener("input", function() {
                updatePasswordStrength(this.value);
            });

            document.getElementById("email").addEventListener("blur", function() {
                const error = validateEmail(this.value);
                showFieldError("email", error);
            });

            document.getElementById("firstName").addEventListener("blur", function() {
                const error = validateName(this.value, "prénom");
                showFieldError("firstName", error);
            });

            document.getElementById("lastName").addEventListener("blur", function() {
                const error = validateName(this.value, "nom de famille");
                showFieldError("lastName", error);
            });

            document.getElementById("password").addEventListener("blur", function() {
                const error = validatePassword(this.value);
                showFieldError("password", error);
            });

            document.getElementById("confirmPassword").addEventListener("blur", function() {
                const password = document.getElementById("password").value;
                if (this.value && this.value !== password) {
                    showFieldError("confirmPassword", "Les mots de passe ne correspondent pas");
                } else {
                    showFieldError("confirmPassword", null);
                }
            });

            
            document.getElementById('profileImage').addEventListener('change', function(e) {
                const file = e.target.files[0];
                const error = validateImage(file);
                
                if (error) {
                    showFieldError('profileImage', error);
                    this.value = '';
                    document.getElementById('imagePreview').style.display = 'none';
                    return;
                }
                
                showFieldError('profileImage', null);
                
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        document.getElementById('previewImg').src = event.target.result;
                        document.getElementById('imagePreview').style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                }
            });

            document.getElementById("registerForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const email = document.getElementById("email").value;
                const firstName = document.getElementById("firstName").value;
                const lastName = document.getElementById("lastName").value;
                const password = document.getElementById("password").value;
                const confirmPassword = document.getElementById("confirmPassword").value;
                const profileImageFile = document.getElementById("profileImage").files[0];

                let hasErrors = false;

                
                const emailError = validateEmail(email);
                showFieldError("email", emailError);
                if (emailError) hasErrors = true;

                const firstNameError = validateName(firstName, "prénom");
                showFieldError("firstName", firstNameError);
                if (firstNameError) hasErrors = true;

                const lastNameError = validateName(lastName, "nom de famille");
                showFieldError("lastName", lastNameError);
                if (lastNameError) hasErrors = true;

                const passwordError = validatePassword(password);
                showFieldError("password", passwordError);
                if (passwordError) hasErrors = true;

                if (password !== confirmPassword) {
                    showFieldError("confirmPassword", "Les mots de passe ne correspondent pas");
                    hasErrors = true;
                } else {
                    showFieldError("confirmPassword", null);
                }

                
                if (profileImageFile) {
                    const imageError = validateImage(profileImageFile);
                    if (imageError) {
                        showFieldError("profileImage", imageError);
                        hasErrors = true;
                    } else {
                        showFieldError("profileImage", null);
                    }
                }

                if (hasErrors) return;

                const registerBtn = document.getElementById("registerBtn");
                const registerSpinner = document.getElementById("registerSpinner");
                const registerBtnText = document.getElementById("registerBtnText");

                registerBtn.disabled = true;
                registerSpinner.style.display = "block";
                registerBtnText.textContent = "Création...";
                hideAlert();

                try {
                    
                    const formData = new FormData();
                    formData.append("email", email.trim().toLowerCase());
                    formData.append("first_name", firstName.trim());
                    formData.append("last_name", lastName.trim());
                    formData.append("password", password);
                    formData.append("confirm_password", confirmPassword);
                    
                    if (profileImageFile) {
                        formData.append("profile_image", profileImageFile);
                    }

                    const response = await fetch(`${API_BASE}/register`, {
                        method: "POST",
                        body: formData, 
                        
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showAlert(
                            (data.message || "Compte créé !") +
                            " Consultez votre email pour activer le compte. Un code OTP suivra après activation.",
                            "success"
                        );

                        
                        setTimeout(() => {
                            window.location.href = "/?registered=true";
                        }, 2500);
                    } else {
                        if (data.detail && Array.isArray(data.detail)) {
                            let errorMessages = [];
                            data.detail.forEach((error) => {
                                if (error.loc && error.loc.length > 1) {
                                    const field = error.loc[1];
                                    const message = error.msg;

                                    const fieldMap = {
                                        email: "email",
                                        password: "password",
                                        confirm_password: "confirmPassword",
                                        first_name: "firstName",
                                        last_name: "lastName",
                                    };

                                    if (fieldMap[field]) {
                                        showFieldError(fieldMap[field], message);
                                    } else {
                                        errorMessages.push(message);
                                    }
                                } else {
                                    errorMessages.push(error.msg || error);
                                }
                            });

                            if (errorMessages.length > 0) {
                                showAlert(errorMessages.join(", "));
                            }
                        } else {
                            showAlert(data.detail || "Erreur lors de la création du compte");
                        }
                    }
                } catch (error) {
                    console.error("Erreur d'inscription:", error);
                    showAlert("Erreur de connexion. Veuillez réessayer.");
                } finally {
                    registerBtn.disabled = false;
                    registerSpinner.style.display = "none";
                    registerBtnText.textContent = "Créer le compte";
                }
            });

            
            window.addEventListener("load", () => {
                const token = localStorage.getItem("access_token");
                if (!token) return;

                const now = Date.now();
                const lastAttempt = parseInt(sessionStorage.getItem("auth_redirect_at") || "0", 10);
                let attempts = parseInt(sessionStorage.getItem("auth_redirect_count") || "0", 10);
                attempts = now - lastAttempt < 5000 ? attempts + 1 : 1;
                sessionStorage.setItem("auth_redirect_at", String(now));
                sessionStorage.setItem("auth_redirect_count", String(attempts));

                if (attempts > 3) {
                    console.warn("Boucle de redirection détectée : arrêt des tentatives automatiques.");
                    sessionStorage.removeItem("auth_redirect_at");
                    sessionStorage.removeItem("auth_redirect_count");
                    return;
                }

                fetch(`${API_BASE}/me`, {
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                })
                .then((response) => {
                    if (response.ok) {
                        sessionStorage.removeItem("auth_redirect_at");
                        sessionStorage.removeItem("auth_redirect_count");
                        window.location.href = "/app";
                    } else {
                        localStorage.removeItem("access_token");
                        localStorage.removeItem("user");
                    }
                })
                .catch(() => {
                    localStorage.removeItem("access_token");
                    localStorage.removeItem("user");
                });
            });
        </script>
    </body>
</html>
