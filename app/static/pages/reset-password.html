<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>OCR Intelligence — Réinitialisation de mot de passe</title>
        <meta
            name="description"
            content="Réinitialisez votre mot de passe OCR Intelligence"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/static/css/theme.css" />
    </head>
    <body>
        <div class="auth-page">
            <a class="brand auth-top-brand" href="/">
                <div class="logo">AI</div>
                <div class="brand-text">OCR Intelligence</div>
            </a>

            <div class="auth-card">
                <div class="auth-card-header">
                    <h2 class="auth-title">🔑 Nouveau mot de passe</h2>
                    <p class="auth-subtitle">
                        Créez un nouveau mot de passe sécurisé.
                    </p>
                </div>

                <div id="alert" class="alert"></div>

                <form id="resetPasswordForm" novalidate>
                    <input type="hidden" id="resetToken" name="token" />

                    <div class="field password-field">
                        <label for="newPassword">Nouveau mot de passe *</label>
                        <input
                            type="password"
                            id="newPassword"
                            name="new_password"
                            required
                            autocomplete="new-password"
                            placeholder="••••••••"
                        />
                        <span
                            class="password-toggle"
                            onclick="togglePassword('newPassword')"
                            >👁️</span
                        >
                        <div class="error-text" id="newPassword-error"></div>
                    </div>

                    <div class="field password-field">
                        <label for="confirmPassword"
                            >Confirmer le mot de passe *</label
                        >
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirm_password"
                            required
                            autocomplete="new-password"
                            placeholder="••••••••"
                        />
                        <span
                            class="password-toggle"
                            onclick="togglePassword('confirmPassword')"
                            >👁️</span
                        >
                        <div
                            class="error-text"
                            id="confirmPassword-error"
                        ></div>
                    </div>

                    <button
                        type="submit"
                        class="btn btn-primary btn-block"
                        id="resetBtn"
                    >
                        <span class="spinner-sm" id="resetSpinner"></span>
                        <span id="resetBtnText">Réinitialiser le mot de passe</span>
                    </button>
                </form>

                <div class="auth-divider"><span>ou</span></div>

                <p class="auth-footer-link">
                    <a href="/">← Retour à la connexion</a>
                </p>
            </div>
        </div>

        <script>
            const API_BASE = "/api";

            function togglePassword(inputId) {
                const input = document.getElementById(inputId);
                const toggle = input.nextElementSibling;

                if (input.type === "password") {
                    input.type = "text";
                    toggle.textContent = "🙈";
                } else {
                    input.type = "password";
                    toggle.textContent = "👁️";
                }
            }

            function validatePassword(password) {
                if (!password) {
                    return "Le mot de passe est obligatoire";
                }
                
                if (password.length < 6) {
                    return "Le mot de passe doit contenir au moins 6 caractères";
                }
                
                return null;
            }

            function updatePasswordStrength(password) {
                
                return;
            }

            function showFieldError(fieldId, message) {
                const field = document.getElementById(fieldId);
                const errorDiv = document.getElementById(fieldId + "-error");

                if (message) {
                    field.classList.add("error");
                    errorDiv.textContent = message;
                    errorDiv.style.display = "block";
                } else {
                    field.classList.remove("error");
                    errorDiv.style.display = "none";
                }
            }

            function showAlert(message, type = "error") {
                const alertDiv = document.getElementById("alert");
                alertDiv.textContent = message;
                alertDiv.className = `alert ${type}`;
                alertDiv.style.display = "block";

                if (type === "success") {
                    setTimeout(() => {
                        window.location.href = "/";
                    }, 2000);
                }
            }

            function hideAlert() {
                document.getElementById("alert").style.display = "none";
            }

            
            window.addEventListener("load", () => {
                const urlParams = new URLSearchParams(window.location.search);
                const token = urlParams.get("token");
                
                if (!token) {
                    showAlert("Lien invalide ou expiré. Demandez un nouveau lien de réinitialisation.");
                    document.getElementById("resetPasswordForm").style.display = "none";
                    return;
                }
                
                document.getElementById("resetToken").value = token;
            });

            
            document.getElementById("newPassword").addEventListener("input", function() {
                updatePasswordStrength(this.value);
                const error = validatePassword(this.value);
                showFieldError("newPassword", error);
            });

            document.getElementById("confirmPassword").addEventListener("input", function() {
                const password = document.getElementById("newPassword").value;
                if (this.value && this.value !== password) {
                    showFieldError("confirmPassword", "Les mots de passe ne correspondent pas");
                } else {
                    showFieldError("confirmPassword", null);
                }
            });

            document.getElementById("resetPasswordForm").addEventListener("submit", async (e) => {
                e.preventDefault();

                const token = document.getElementById("resetToken").value;
                const newPassword = document.getElementById("newPassword").value;
                const confirmPassword = document.getElementById("confirmPassword").value;

                let hasErrors = false;

                const passwordError = validatePassword(newPassword);
                showFieldError("newPassword", passwordError);
                if (passwordError) hasErrors = true;

                if (newPassword !== confirmPassword) {
                    showFieldError("confirmPassword", "Les mots de passe ne correspondent pas");
                    hasErrors = true;
                } else {
                    showFieldError("confirmPassword", null);
                }

                if (hasErrors) return;

                const resetBtn = document.getElementById("resetBtn");
                const resetSpinner = document.getElementById("resetSpinner");
                const resetBtnText = document.getElementById("resetBtnText");

                resetBtn.disabled = true;
                resetSpinner.style.display = "block";
                resetBtnText.textContent = "Réinitialisation...";
                hideAlert();

                try {
                    const formData = new FormData();
                    formData.append("token", token);
                    formData.append("new_password", newPassword);
                    formData.append("confirm_password", confirmPassword);

                    const response = await fetch(`${API_BASE}/reset-password`, {
                        method: "POST",
                        body: formData,
                    });

                    const data = await response.json();

                    if (response.ok) {
                        showAlert("✅ Mot de passe réinitialisé avec succès ! Redirection...", "success");
                    } else {
                        showAlert(data.detail || "Erreur lors de la réinitialisation du mot de passe");
                    }
                } catch (error) {
                    console.error("Reset password error:", error);
                    showAlert("Erreur de connexion. Veuillez réessayer.");
                } finally {
                    resetBtn.disabled = false;
                    resetSpinner.style.display = "none";
                    resetBtnText.textContent = "Réinitialiser le mot de passe";
                }
            });
        </script>
    </body>
</html>
